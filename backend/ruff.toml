# Ruff — Python linter and formatter configuration.
# Run: ruff check . && ruff format .

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments (warn on unused *args / **kwargs)
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

[format]
quote-style = "double"
indent-style = "space"
